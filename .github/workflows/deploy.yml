name: Deploy

on: # trigger
  workflow_call: # Whenever this workflow need to be called from another workflow 

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Clone the code
        uses: actions/checkout@v7  
      - name: Deploy via Nginx
        run: cp index.html /var/www/html 
      - name: Deploy the Code
        run: echo "Code Deployed AWS-EC2 instance"
